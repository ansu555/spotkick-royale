[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@pythnetwork/entropy-sdk-solidity/=lib/entropy-sdk-solidity/",
]
fs_permissions = [
  { access = "read", path = "../packages/shared" },
  { access = "read", path = "./" },
  { access = "read-write", path = "./deployments" },
]

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad = "${MONAD_RPC}"

[lint]
lint_on_build = false

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 80
fail_on_revert = false
